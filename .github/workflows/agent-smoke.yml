name: Agent Smoke (Firecrawl research router)

# Manual only. No Airtable, email or other secrets: only FIRECRAWL_API_KEY is exposed.
# Output is counts and provider outcomes, never page content.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Research router smoke
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PER_RUN: "3"
        run: npm run --silent smoke:agents | tee smoke-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-smoke-summary
          path: smoke-summary.txt
          if-no-files-found: ignore
