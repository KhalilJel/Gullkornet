name: OpenOutSend Ingest API Tests

on:
  push:
    branches:
      - phase9/openoutsend-ingest-api

jobs:
  test-ingest-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run ingest API tests
        run: python -m unittest discover -s tests -p 'test_openoutsend_ingest_api.py' -v
      - name: Build Docker image (includes API unit tests)
        run: docker build --tag openoutsend-ingest-api-test .
