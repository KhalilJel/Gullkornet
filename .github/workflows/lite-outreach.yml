name: Gullkornet Lite Outreach

# Sends the fixed, owner-approved Lite template to "Lite Ready" Airtable rows.
# One coordinated run a day, every day: up to the daily limit (95, rolling 24 h, account-wide, so
# earlier sends are subtracted) spread evenly over 11:00-12:00 Europe/Oslo, about one every 38 s.
# GitHub cron is UTC and best-effort, so several triggers cover summer (UTC+2) and winter (UTC+1)
# time: the code (src/lite/schedule.ts) lets a run start at most 30 minutes before 11:00 Oslo and
# wait, and every trigger outside 10:30-12:00 Oslo ends before any provider or CRM call. The
# concurrency group runs one at a time, so a later trigger only continues the same slot or no-ops.
# Scheduled sending remains off unless its secret is enabled. Manual one_off_date (today, Oslo)
# runs the owner's one-off: the same limits, spread over the next 60 minutes. Manual pilot_send
# permits one explicitly enabled run of up to 2 messages. Manual preview never sends or writes.
on:
  schedule:
    - cron: "35 8 * * *"
    - cron: "50 8 * * *"
    - cron: "35 9 * * *"
    - cron: "50 9 * * *"
    - cron: "5 10 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Technical preview only; not provider permission; never sends or writes"
        required: true
        default: true
        type: boolean
      preview_limit:
        description: "Preview: rows to check (oldest first)"
        required: false
        default: "95"
        type: string
      preview_record_ids:
        description: "Optional: 1-5 comma-separated record IDs for an exact read-only pilot preview"
        required: false
        default: ""
        type: string
      pilot_send:
        description: "Enable this one authorized run (up to 2 messages over the next 60 minutes, requires preview=false)"
        required: false
        default: false
        type: boolean
      one_off_date:
        description: "Owner one-off: today's date in Oslo (YYYY-MM-DD) sends now, spread over 60 minutes (requires preview=false and the live switch)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: gullkornet-lite-outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # 30 min lead + 60 min slot + setup and the last send's checks.
    timeout-minutes: 105
    env:
      GULLKORNET_LITE_ENABLE_LIVE_SEND: ${{ secrets.GULLKORNET_LITE_ENABLE_LIVE_SEND }}
      GULLKORNET_LITE_DAILY_LIMIT: ${{ vars.GULLKORNET_LITE_DAILY_LIMIT || '95' }}
      # Fixed with the 11-12 slot (not repository variables, which still hold the old 10-minute values).
      GULLKORNET_LITE_START_HOUR: "11"
      GULLKORNET_LITE_END_HOUR: "12"
      GULLKORNET_LITE_HOURLY_LIMIT: "95"
      GULLKORNET_LITE_MAX_PER_RUN: "95"
      GULLKORNET_LITE_MIN_SPACING_SECONDS: "30"
      GULLKORNET_LITE_ORG_FORMS: ${{ vars.GULLKORNET_LITE_ORG_FORMS || 'AS,ASA' }}
      RESEND_DAILY_QUOTA: ${{ vars.RESEND_DAILY_QUOTA }}
      RESEND_MONTHLY_QUOTA: ${{ vars.RESEND_MONTHLY_QUOTA }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
      GULLKORNET_LITE_RESEARCH_KEY: ${{ secrets.GULLKORNET_LITE_RESEARCH_KEY }}
      GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
      GULLKORNET_AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
      OPENOUTREACH_REPLY_STATUS_URL: ${{ vars.OPENOUTREACH_REPLY_STATUS_URL }}
      OPENOUTREACH_REPLY_STATUS_TOKEN: ${{ secrets.OPENOUTREACH_REPLY_STATUS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Read-only preview (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.preview
        env:
          PREVIEW_LIMIT: ${{ inputs.preview_limit }}
          PREVIEW_RECORD_IDS: ${{ inputs.preview_record_ids }}
        run: |
          umask 077
          case "$PREVIEW_LIMIT" in ''|*[!0-9]*) echo "preview_limit must be a number"; exit 1 ;; esac
          args=(--limit "$PREVIEW_LIMIT")
          if [ -n "$PREVIEW_RECORD_IDS" ]; then args+=(--preview-record-ids "$PREVIEW_RECORD_IDS"); fi
          npm run --silent send:lite -- --preview "${args[@]}"

      - name: Send Lite outreach (no-op while the kill switch is off)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.preview)
        env:
          MANUAL_PILOT_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot_send }}
          ONE_OFF_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.one_off_date || '' }}
          SELECTED_PREVIEW_IDS: ${{ inputs.preview_record_ids }}
        run: |
          umask 077
          if [ -n "$SELECTED_PREVIEW_IDS" ]; then echo "Selected preview IDs cannot be used for live sending"; exit 1; fi
          if [ -n "$ONE_OFF_DATE" ]; then export GULLKORNET_LITE_ONE_OFF_DATE="$ONE_OFF_DATE"; fi
          if [ "$MANUAL_PILOT_SEND" = "true" ]; then
            export GULLKORNET_LITE_ENABLE_LIVE_SEND=true GULLKORNET_LITE_MAX_PER_RUN=2
            export GULLKORNET_LITE_ONE_OFF_DATE="$(TZ=Europe/Oslo date +%F)"
          fi
          npm run --silent send:lite
