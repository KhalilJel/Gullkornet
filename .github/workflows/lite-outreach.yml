name: Gullkornet Lite Outreach

# Sends the fixed, owner-approved Lite template to "Lite Ready" Airtable rows.
# Runs every 10 minutes, every day; the 08:00-20:00 Europe/Oslo window (summer and winter),
# the daily target, hourly limit, spacing and Resend quota are enforced in code
# (src/lite/schedule.ts). Each run sends at most GULLKORNET_LITE_MAX_PER_RUN emails, so a
# skipped or delayed GitHub cron run is caught up by the next one.
# Scheduled sending remains off unless its secret is enabled. Manual pilot_send permits
# one explicitly enabled run. Owner-confirmed operation is capped at 95/day and 2/run.
# Manual preview never sends or writes.
on:
  schedule:
    - cron: "*/10 6-18 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Technical preview only; not provider permission; never sends or writes"
        required: true
        default: true
        type: boolean
      preview_limit:
        description: "Preview: rows to check (oldest first)"
        required: false
        default: "95"
        type: string
      preview_record_ids:
        description: "Optional: 1-5 comma-separated record IDs for an exact read-only pilot preview"
        required: false
        default: ""
        type: string
      pilot_send:
        description: "Enable this one authorized run (up to 2 messages, requires preview=false)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gullkornet-lite-outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GULLKORNET_LITE_ENABLE_LIVE_SEND: ${{ secrets.GULLKORNET_LITE_ENABLE_LIVE_SEND }}
      GULLKORNET_LITE_DAILY_LIMIT: ${{ vars.GULLKORNET_LITE_DAILY_LIMIT || '95' }}
      GULLKORNET_LITE_HOURLY_LIMIT: ${{ vars.GULLKORNET_LITE_HOURLY_LIMIT || '15' }}
      GULLKORNET_LITE_MAX_PER_RUN: ${{ vars.GULLKORNET_LITE_MAX_PER_RUN || '2' }}
      GULLKORNET_LITE_MIN_SPACING_SECONDS: ${{ vars.GULLKORNET_LITE_MIN_SPACING_SECONDS || '60' }}
      GULLKORNET_LITE_ORG_FORMS: ${{ vars.GULLKORNET_LITE_ORG_FORMS || 'AS,ASA' }}
      RESEND_DAILY_QUOTA: ${{ vars.RESEND_DAILY_QUOTA }}
      RESEND_MONTHLY_QUOTA: ${{ vars.RESEND_MONTHLY_QUOTA }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
      GULLKORNET_LITE_RESEARCH_KEY: ${{ secrets.GULLKORNET_LITE_RESEARCH_KEY }}
      GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
      GULLKORNET_AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
      OPENOUTREACH_REPLY_STATUS_URL: ${{ vars.OPENOUTREACH_REPLY_STATUS_URL }}
      OPENOUTREACH_REPLY_STATUS_TOKEN: ${{ secrets.OPENOUTREACH_REPLY_STATUS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Read-only preview (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.preview
        env:
          PREVIEW_LIMIT: ${{ inputs.preview_limit }}
          PREVIEW_RECORD_IDS: ${{ inputs.preview_record_ids }}
        run: |
          umask 077
          case "$PREVIEW_LIMIT" in ''|*[!0-9]*) echo "preview_limit must be a number"; exit 1 ;; esac
          args=(--limit "$PREVIEW_LIMIT")
          if [ -n "$PREVIEW_RECORD_IDS" ]; then args+=(--preview-record-ids "$PREVIEW_RECORD_IDS"); fi
          npm run --silent send:lite -- --preview "${args[@]}"

      - name: Send Lite outreach (no-op while the kill switch is off)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.preview)
        env:
          MANUAL_PILOT_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot_send }}
          SELECTED_PREVIEW_IDS: ${{ inputs.preview_record_ids }}
        run: |
          umask 077
          if [ -n "$SELECTED_PREVIEW_IDS" ]; then echo "Selected preview IDs cannot be used for live sending"; exit 1; fi
          if [ "$MANUAL_PILOT_SEND" = "true" ]; then export GULLKORNET_LITE_ENABLE_LIVE_SEND=true; fi
          npm run --silent send:lite
