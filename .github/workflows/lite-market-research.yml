name: Gullkornet Lite Market Research

# Documents the template sentence "Vi har sett på hvordan bedrifter i deres marked presenterer seg
# digitalt" for one segment (NACE code x region): fetches the front pages of a spread sample of
# registered AS/ASA websites in Brønnøysund and stores what was observed in research/segments/,
# encrypted with the GULLKORNET_LITE_RESEARCH_KEY secret (the repository is public).
# The result is proposed as a pull request; Lite sends to a segment only after that file is on main
# and less than 90 days old. Public data only: no Airtable, no Resend, never sends email.
on:
  workflow_dispatch:
    inputs:
      industry:
        description: "NACE code(s) (SN2025), e.g. 96.210 or 43.220,56.110 (comma-separated batch)"
        required: true
        type: string
      region:
        description: "Region"
        required: true
        default: "oslo-akershus"
        type: choice
        options: [oslo-akershus, ostfold, buskerud, vestfold, all]
      sample:
        description: "Sites to examine (8-40)"
        required: true
        default: "15"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gullkornet-lite-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # One segment takes 1-3 minutes; a batch of industries x all regions needs more.
    timeout-minutes: 240
    env:
      INPUT_INDUSTRY: ${{ inputs.industry }}
      INPUT_REGION: ${{ inputs.region }}
      INPUT_SAMPLE: ${{ inputs.sample }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Research the segment
        env:
          GULLKORNET_LITE_RESEARCH_KEY: ${{ secrets.GULLKORNET_LITE_RESEARCH_KEY }}
        run: |
          umask 077
          case "$INPUT_SAMPLE" in ''|*[!0-9]*) echo "sample must be a number"; exit 1 ;; esac
          IFS=',' read -r -a industries <<< "$INPUT_INDUSTRY"
          if [ "${#industries[@]}" -gt 20 ]; then echo "At most 20 industries per batch"; exit 1; fi
          for code in "${industries[@]}"; do
            case "$code" in [0-9][0-9].[0-9]|[0-9][0-9].[0-9][0-9]|[0-9][0-9].[0-9][0-9][0-9]) ;; *) echo "industry must be a NACE code such as 96.210"; exit 1 ;; esac
          done
          if [ "$INPUT_REGION" = "all" ]; then regions=(oslo-akershus ostfold buskerud vestfold); else regions=("$INPUT_REGION"); fi
          failed=0
          for code in "${industries[@]}"; do
            for region in "${regions[@]}"; do
              # One segment that cannot be researched (no websites, Brreg hiccup) must not lose the rest.
              npm run --silent lite:research -- --industry "$code" --region "$region" --sample "$INPUT_SAMPLE" --write || failed=$((failed + 1))
            done
          done
          echo "Segments that failed to run: $failed"

      - name: Propose the research as a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          if [ -z "$(git status --porcelain research/segments)" ]; then echo "No research file changed."; exit 0; fi
          label="$(echo "$INPUT_INDUSTRY" | tr ',' '_' | cut -c1-60)"
          branch="research/lite-${label}-${INPUT_REGION}-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add research/segments
          git commit -m "research(lite): ${INPUT_INDUSTRY} @ ${INPUT_REGION}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Lite market research: ${INPUT_INDUSTRY} @ ${INPUT_REGION}" \
            --body "Automated front-page review for the Lite template claim. Review the observations, then merge to enable this segment for 90 days."
