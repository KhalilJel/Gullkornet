name: Gullkornet Digital Presence Research

on:
  workflow_run:
    workflows: ["Gullkornet Website Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: "Successful Website Audit workflow run ID whose candidate artifact should be checked"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download website audit and candidate inputs
        uses: actions/download-artifact@v4
        with:
          name: gullkornet-website-audit
          path: data/input
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Research website and social profile links
        run: |
          test -f data/input/source/google-candidates.json
          npx tsx src/cli/research-digital-presence.ts data/input/source/google-candidates.json > data/digital-presence-results.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const rows = JSON.parse(await readFile("data/digital-presence-results.json", "utf8"));
          if (!Array.isArray(rows)) throw new Error("Digital presence results must be an array.");
          const count = (segment) => rows.filter((row) => row.segment === segment).length;
          const summary = {
            generatedAt: new Date().toISOString(),
            total: rows.length,
            noWebsiteListed: count("NO_WEBSITE_LISTED"),
            withSocialLinks: count("WEBSITE_WITH_SOCIAL_LINKS"),
            withoutDetectedSocialLinks: count("WEBSITE_WITHOUT_DETECTED_SOCIAL_LINKS"),
            errors: count("FETCH_ERROR") + count("BLOCKED_URL"),
            emailSent: 0
          };
          await writeFile("data/digital-presence-summary.json", JSON.stringify(summary, null, 2) + "\\n", { encoding: "utf8", mode: 0o600 });
          console.log(JSON.stringify(summary, null, 2));
          console.log("No emails were sent. Missing links are not proof of absent websites or social accounts.");
          NODE

      - name: Upload metadata-only digital presence summary
        uses: actions/upload-artifact@v4
        with:
          name: gullkornet-digital-presence-summary
          path: data/digital-presence-summary.json
          retention-days: 7
