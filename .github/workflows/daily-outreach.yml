name: Gullkornet Outreach Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build review queue
        env:
          OUTREACH_FROM_EMAIL: "jelassi@smartsvar.no"
        run: |
          test -f data/contact-research-drafts.json || echo "No local artifact in repository; preview requires a research artifact."
          if [ -f data/contact-research-drafts.json ]; then
            npm run --silent review-queue -- data/contact-research-drafts.json data/lead-review-queue.md
            cat data/lead-review-queue.md
          fi

      - name: Safety note
        run: |
          echo "Preview only."
          echo "No Resend API key is used."
          echo "No email is sent."
          echo "Live sending must remain a separate, explicitly approved step.";
