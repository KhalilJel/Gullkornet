name: Gullkornet Daily Outreach

on:
  workflow_run:
    workflows: ["Gullkornet Contact Research and Drafts"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: gullkornet-daily-outreach
  cancel-in-progress: false

jobs:
  send:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download researched drafts
        uses: actions/download-artifact@v4
        with:
          name: gullkornet-contact-research-drafts
          path: data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send up to 20 eligible emails
        env:
          GULLKORNET_ENABLE_LIVE_SEND: ${{ vars.GULLKORNET_ENABLE_LIVE_SEND }}
          GULLKORNET_DAILY_SEND_LIMIT: "20"
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
          GULLKORNET_AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTREACH_FROM_EMAIL: "jelassi@smartsvar.no"
        run: npm run --silent send:daily -- data/contact-research-drafts.json
