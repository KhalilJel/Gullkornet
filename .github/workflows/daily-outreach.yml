name: Gullkornet Daily Outreach

on:
  # Queue check every five minutes on weekdays from 07:00 to 14:55 UTC. That superset covers
  # 09:00-15:00 Europe/Oslo in both summer (UTC+2) and winter (UTC+1); the exact window,
  # five-minute spacing and the 12/hour and 100/Oslo-day limits are enforced in code
  # (src/integrations/send-schedule.ts), and each run sends at most one email.
  # The kill switch keeps this a no-op until production sending is explicitly enabled.
  schedule:
    - cron: "*/5 7-14 * * 1-5"

permissions:
  contents: read

concurrency:
  group: gullkornet-daily-outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GULLKORNET_ENABLE_LIVE_SEND: ${{ secrets.GULLKORNET_ENABLE_LIVE_SEND }}
      GULLKORNET_DAILY_SEND_LIMIT: "100"
      MAX_EMAILS_PER_RUN: "1"
      AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
      GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
      GULLKORNET_AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OPENOUTREACH_REPLY_STATUS_URL: ${{ vars.OPENOUTREACH_REPLY_STATUS_URL }}
      OPENOUTREACH_REPLY_STATUS_TOKEN: ${{ secrets.OPENOUTREACH_REPLY_STATUS_TOKEN }}
      OUTREACH_FROM_EMAIL: "hello@cideamarketing.com"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Keep live sending paused until the kill switch is enabled
        if: env.GULLKORNET_ENABLE_LIVE_SEND != 'true'
        run: echo "Daily outreach check skipped; live sending kill switch is off."

      - name: Send one approved personalized outreach email
        if: env.GULLKORNET_ENABLE_LIVE_SEND == 'true'
        run: npm run --silent send:daily
