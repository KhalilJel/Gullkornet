name: Gullkornet Reply-Status Check

# Manual, read-only check that the reply monitor sees mail sent to hello@cideamarketing.com.
# Positive control: the address in the GULLKORNET_REPLY_TEST_SENDER secret, which has written to hello@
# (expects replied=true). Negative control: a fresh address under .invalid (expects replied=false).
# Two reply-status lookups only: no Airtable, Resend or Migadu writes, no email sent.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gullkornet-reply-status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENOUTREACH_REPLY_STATUS_URL: ${{ vars.OPENOUTREACH_REPLY_STATUS_URL }}
      OPENOUTREACH_REPLY_STATUS_TOKEN: ${{ secrets.OPENOUTREACH_REPLY_STATUS_TOKEN }}
      GULLKORNET_REPLY_TEST_SENDER: ${{ secrets.GULLKORNET_REPLY_TEST_SENDER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Reply monitor health (public /health, safe fields only)
        shell: bash
        run: |
          base="${OPENOUTREACH_REPLY_STATUS_URL%/v1/reply-status}"
          code=$(curl --silent --show-error --max-time 20 -o /tmp/health.json -w '%{http_code}' "$base/health" || echo 000)
          echo "health HTTP $code"
          jq -c '{ok, service, reply_monitor: (.reply_monitor | {status, last_check_at, last_success_at, last_error_code, last_counts})}' /tmp/health.json 2>/dev/null || echo "health body is not service JSON (edge or proxy error)"

      - name: Reply-status check (read-only)
        run: npm run --silent check:reply-status
