name: Gullkornet Lite Audit

# Read-only data-quality and sales overview: every Lite Ready row against the recipient policy,
# duplicates, segment research and a fresh Brreg + MX check; sales statuses, offers and paid
# revenue against the goal. Writes nothing, sends nothing; prints record IDs and counts only.
on:
  workflow_dispatch:
    inputs:
      lookup:
        description: "Optional comma-separated domain fingerprints (src/lite/fingerprint.ts) to look up"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
      GULLKORNET_LITE_RESEARCH_KEY: ${{ secrets.GULLKORNET_LITE_RESEARCH_KEY }}
      GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
      GULLKORNET_AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
      GULLKORNET_LITE_ORG_FORMS: ${{ vars.GULLKORNET_LITE_ORG_FORMS || 'AS,ASA' }}
      GULLKORNET_AIRTABLE_WRITES: disabled
      LITE_AUDIT_LOOKUP: ${{ inputs.lookup }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Lite audit (read-only)
        run: |
          umask 077
          npm run --silent lite:audit
