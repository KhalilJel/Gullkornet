name: Temporary lockfile bootstrap (no auto-commit)

on:
  push:
    branches:
      - chore/bootstrap-lockfile-2026-10-10

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile artifact only
        uses: actions/upload-artifact@v4
        with:
          name: gullkornet-package-lock-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
