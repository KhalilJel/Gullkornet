name: Gullkornet Unified Lead Research (Manual)

on:
  workflow_dispatch:
    inputs:
      search_term:
        description: "Business type to research"
        required: true
        default: "frisør"
        type: string
      daily_lead_limit:
        description: "Maximum new candidates for this run"
        required: true
        default: "25"
        type: string
      sync_to_airtable:
        description: "Persist researched drafts to Airtable for human review"
        required: true
        default: false
        type: boolean
      places_max_pages:
        description: "Google Places pages per city for this run only (each page is a billed request)"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      create_only_draft_ready:
        description: "When syncing, create new Airtable rows only for Draft Ready businesses (this run only)"
        required: true
        default: false
        type: boolean
  # Callable only by the gated scheduler workflow (scheduled-lead-pipeline.yml). This workflow
  # has no schedule, push or pull_request trigger of its own.
  workflow_call:
    inputs:
      search_term:
        required: true
        type: string
      daily_lead_limit:
        required: true
        type: string
      sync_to_airtable:
        required: true
        type: boolean
    secrets:
      GOOGLE_MAPS_API_KEY:
        required: true
      AIRTABLE_API_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: gullkornet-unified-lead-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Restore minimal discovery deduplication history
        uses: actions/cache/restore@v4
        with:
          path: data/discovery-history.json
          key: gullkornet-unified-history-${{ github.run_id }}
          restore-keys: |
            gullkornet-unified-history-

      - name: Discover candidates into runner-local storage
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SEARCH_TERM: ${{ inputs.search_term }}
          DAILY_LEAD_LIMIT: ${{ inputs.daily_lead_limit }}
          DISCOVERY_HISTORY_PATH: data/discovery-history.json
          UPDATE_DISCOVERY_HISTORY: "true"
          # Opt-in, unset by default (= 1 page): 2-3 Google Places pages per city, each a billed request.
          # A manual run uses its own input; a call from the scheduler has no input and uses the variable.
          PLACES_MAX_PAGES_INPUT: ${{ inputs.places_max_pages }}
          PLACES_MAX_PAGES_VAR: ${{ vars.GULLKORNET_PLACES_MAX_PAGES }}
          DISCOVERY_STATS_PATH: data/discovery-stats.json
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${PLACES_MAX_PAGES_INPUT:-}" ]; then
            if ! [[ "$PLACES_MAX_PAGES_INPUT" =~ ^[1-3]$ ]]; then
              echo "places_max_pages must be 1, 2 or 3."
              exit 1
            fi
            export GULLKORNET_PLACES_MAX_PAGES="$PLACES_MAX_PAGES_INPUT"
          else
            export GULLKORNET_PLACES_MAX_PAGES="${PLACES_MAX_PAGES_VAR:-}"
          fi
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "Missing repository secret GOOGLE_MAPS_API_KEY."
            exit 1
          fi
          if [ -z "${SEARCH_TERM//[[:space:]]/}" ]; then
            echo "A non-empty search term is required."
            exit 1
          fi
          if ! [[ "$DAILY_LEAD_LIMIT" =~ ^[0-9]+$ ]] || (( DAILY_LEAD_LIMIT < 1 || DAILY_LEAD_LIMIT > 100 )); then
            echo "DAILY_LEAD_LIMIT must be an integer from 1 to 100."
            exit 1
          fi
          mkdir -p data
          chmod 700 data
          if ! npm run --silent discover:google -- "$SEARCH_TERM" > data/google-candidates.json 2> data/discovery.stderr.log; then
            chmod 600 data/google-candidates.json data/discovery.stderr.log 2>/dev/null || true
            echo "Candidate discovery failed; private diagnostics were not printed."
            exit 1
          fi
          chmod 600 data/google-candidates.json data/discovery.stderr.log
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const rows = JSON.parse(await readFile("data/google-candidates.json", "utf8"));
          if (!Array.isArray(rows)) throw new Error("Candidate discovery did not return an array.");
          const stats = JSON.parse(await readFile("data/discovery-stats.json", "utf8"));
          console.log(JSON.stringify({
            stage: "discovery",
            candidateCount: rows.length,
            placesRequests: stats.placesRequests,
            maxPagesPerCity: stats.maxPagesPerCity,
            rawCandidates: stats.rawCandidates,
            rawWithWebsite: stats.rawWithWebsite
          }));
          NODE

      - name: Audit candidate websites in runner-local storage
        run: |
          set -euo pipefail
          umask 077
          if ! npm run --silent audit:websites -- data/google-candidates.json > data/website-audit.json 2> data/website-audit.stderr.log; then
            chmod 600 data/website-audit.json data/website-audit.stderr.log 2>/dev/null || true
            echo "Website audit failed; private diagnostics were not printed."
            exit 1
          fi
          chmod 600 data/website-audit.json data/website-audit.stderr.log
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const rows = JSON.parse(await readFile("data/website-audit.json", "utf8"));
          if (!Array.isArray(rows)) throw new Error("Website audit did not return an array.");
          console.log(JSON.stringify({
            stage: "website-audit",
            total: rows.length,
            audited: rows.filter((row) => row.status === "AUDITED").length,
            withoutWebsite: rows.filter((row) => row.status === "NO_WEBSITE").length,
            errors: rows.filter((row) => ["FETCH_ERROR", "BLOCKED_URL"].includes(row.status)).length
          }));
          NODE

      - name: Research public contacts and prepare drafts locally
        run: |
          set -euo pipefail
          umask 077
          if ! npm run --silent research:contacts -- data/google-candidates.json data/website-audit.json > data/contact-research-drafts.json 2> data/contact-research.stderr.log; then
            chmod 600 data/contact-research-drafts.json data/contact-research.stderr.log 2>/dev/null || true
            echo "Contact research failed; private diagnostics were not printed."
            exit 1
          fi
          chmod 600 data/contact-research-drafts.json data/contact-research.stderr.log
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const rows = JSON.parse(await readFile("data/contact-research-drafts.json", "utf8"));
          if (!Array.isArray(rows)) throw new Error("Contact research did not return an array.");
          console.log(JSON.stringify({
            stage: "contact-research",
            total: rows.length,
            withPublicEmail: rows.filter((row) => Array.isArray(row.emails) && row.emails.length > 0).length,
            withDraft: rows.filter((row) => typeof row.subject === "string" && typeof row.draftBody === "string").length,
            requiringReview: rows.filter((row) => row.requiresHumanReview === true).length,
            emailSent: 0
          }));
          NODE
          echo "No emails were sent. Human review is required."

      - name: Sync researched drafts to Airtable only when explicitly selected
        if: ${{ inputs.sync_to_airtable }}
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
          # Opt-in, unset by default (= create every researched row): "true" creates only Draft Ready rows.
          # A manual run uses its own input; a call from the scheduler has no input and uses the variable.
          CREATE_ONLY_DRAFT_READY_INPUT: ${{ inputs.create_only_draft_ready }}
          CREATE_ONLY_DRAFT_READY_VAR: ${{ vars.GULLKORNET_SYNC_CREATE_ONLY_DRAFT_READY }}
        run: |
          set -euo pipefail
          umask 077
          case "${CREATE_ONLY_DRAFT_READY_INPUT:-}" in
            true|false) export GULLKORNET_SYNC_CREATE_ONLY_DRAFT_READY="$CREATE_ONLY_DRAFT_READY_INPUT" ;;
            "") export GULLKORNET_SYNC_CREATE_ONLY_DRAFT_READY="${CREATE_ONLY_DRAFT_READY_VAR:-}" ;;
            *) echo "create_only_draft_ready must be true or false."; exit 1 ;;
          esac
          if [ -z "${AIRTABLE_API_TOKEN:-}" ] || [ -z "${GULLKORNET_AIRTABLE_BASE_ID:-}" ]; then
            echo "Airtable sync was requested but required credentials/configuration are missing."
            exit 1
          fi
          if ! npm run --silent sync:airtable -- data/contact-research-drafts.json > data/airtable-sync.stdout.log 2> data/airtable-sync.stderr.log; then
            chmod 600 data/airtable-sync.stdout.log data/airtable-sync.stderr.log 2>/dev/null || true
            echo "Airtable sync failed; private diagnostics were not printed."
            exit 1
          fi
          chmod 600 data/airtable-sync.stdout.log data/airtable-sync.stderr.log
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile("data/airtable-sync.stdout.log", "utf8"));
          // Counts only; base id, table name and record content stay in the private log.
          console.log(JSON.stringify({
            stage: "airtable-sync",
            createOnlyDraftReady: process.env.GULLKORNET_SYNC_CREATE_ONLY_DRAFT_READY === "true",
            created: result.created,
            updated: result.updated,
            skipped: result.skipped,
            notCreated: result.notCreated,
            duplicateEmail: Number(result.duplicateEmail) || 0
          }));
          NODE
          echo "Airtable sync complete. No emails were sent."

      - name: Create aggregate-only run summary
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const candidates = JSON.parse(await readFile("data/google-candidates.json", "utf8"));
          const audits = JSON.parse(await readFile("data/website-audit.json", "utf8"));
          const records = JSON.parse(await readFile("data/contact-research-drafts.json", "utf8"));
          const summary = {
            generatedAt: new Date().toISOString(),
            candidates: candidates.length,
            websitesAudited: audits.length,
            recordsWithPublicEmail: records.filter((row) => Array.isArray(row.emails) && row.emails.length > 0).length,
            recordsWithDraft: records.filter((row) => typeof row.subject === "string" && typeof row.draftBody === "string").length,
            recordsRequiringHumanReview: records.filter((row) => row.requiresHumanReview === true).length,
            airtableSyncRequested: process.env.SYNC_TO_AIRTABLE === "true",
            emailSent: 0
          };
          await writeFile("data/unified-lead-research-summary.json", JSON.stringify(summary, null, 2) + "\n", { encoding: "utf8", mode: 0o600 });
          console.log(JSON.stringify(summary));
          NODE
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
          SYNC_TO_AIRTABLE: ${{ inputs.sync_to_airtable }}

      - name: Upload aggregate-only summary
        uses: actions/upload-artifact@v4
        with:
          name: gullkornet-unified-lead-research-summary
          path: data/unified-lead-research-summary.json
          retention-days: 90

      - name: Save minimal discovery history
        uses: actions/cache/save@v4
        with:
          path: data/discovery-history.json
          key: gullkornet-unified-history-${{ github.run_id }}
