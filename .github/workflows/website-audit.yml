name: Gullkornet Website Audit

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Google Places discovery run ID"
        required: true
        default: "36840881370"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: gullkornet-google-candidates
          path: data/source
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit public business websites
        run: |
          test -f data/source/google-candidates.json
          npm run --silent audit:websites -- data/source/google-candidates.json > data/website-audit.json
          echo "Website audit output created. Signals are automated and require manual review."

      - name: Upload website audit results
        uses: actions/upload-artifact@v4
        with:
          name: gullkornet-website-audit
          path: data/website-audit.json
          retention-days: 3
