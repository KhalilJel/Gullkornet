name: Gullkornet Website Audit

on:
  workflow_run:
    workflows: ["Gullkornet Google Places Discovery"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Google Places discovery run ID (manual runs only)"
        required: true
        default: "36840881370"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: gullkornet-google-candidates
          path: data/source
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit public business websites
        run: |
          test -f data/source/google-candidates.json
          npm run --silent audit:websites -- data/source/google-candidates.json > data/website-audit.json
          echo "Website audit output created. Signals are automated and require manual review."

      - name: Upload single website audit handoff
        uses: actions/upload-artifact@v4
        with:
          name: gullkornet-website-audit
          path: data/website-audit.json
          retention-days: 7
