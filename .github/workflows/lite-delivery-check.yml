name: Gullkornet Lite Delivery Check

# Manual only. Read-only by default: lists the Resend bounced/complained/failed/suppressed events
# behind the delivery-health stop, with the provider's diagnostic fields and the matching Airtable
# rows' state. Logs carry no addresses (recipient = short hash + Airtable record ID).
# apply_suppression=true ticks Do Not Contact on exact-address rows of bounced, complained or
# suppressed recipients. It never sends email and never changes the stop itself.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of Resend history to read (1-30)"
        required: true
        default: "7"
        type: string
      apply_suppression:
        description: "Tick Do Not Contact on affected exact-address rows (writes Airtable)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gullkornet-lite-delivery-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
      GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
      GULLKORNET_AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Delivery check
        env:
          DAYS: ${{ inputs.days }}
          APPLY: ${{ inputs.apply_suppression }}
        run: |
          umask 077
          case "$DAYS" in ''|*[!0-9]*) echo "days must be a number"; exit 1 ;; esac
          args=(--days "$DAYS")
          if [ "$APPLY" = "true" ]; then args+=(--apply-suppression); fi
          npm run --silent lite:delivery-check -- "${args[@]}"
