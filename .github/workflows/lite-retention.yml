name: Gullkornet Lite Retention

# 90-day retention for Lite rows (docs/LITE-LAGRING-OG-SLETTING.md). Manual only.
# Default: dry-run (prints record IDs and counts, changes nothing).
# Applying needs BOTH the input execute=true AND the repository variable
# GULLKORNET_LITE_RETENTION_ENABLED=true (owner approval). Reservations are minimised, never deleted.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Apply the plan (also needs variable GULLKORNET_LITE_RETENTION_ENABLED=true)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gullkornet-lite-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
      GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
      GULLKORNET_AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
      GULLKORNET_LITE_RETENTION_EXECUTE: ${{ inputs.execute && vars.GULLKORNET_LITE_RETENTION_ENABLED == 'true' && 'true' || 'false' }}
      GULLKORNET_AIRTABLE_WRITES: ${{ inputs.execute && vars.GULLKORNET_LITE_RETENTION_ENABLED == 'true' && 'enabled' || 'disabled' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Retention dry-run
        if: ${{ !inputs.execute }}
        run: npm run --silent lite:retention

      - name: Apply retention (owner-approved)
        if: ${{ inputs.execute }}
        run: npm run --silent lite:retention -- --execute
