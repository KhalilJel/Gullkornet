name: Gullkornet Lite Clock

# The durable daily timer for Gullkornet Lite, independent of any Claude session or outside service.
# GitHub's own schedule delivers this repository's events hours late or not at all (measured
# 14-20 Oct 2026), so this workflow keeps time itself: each run sleeps until the next event of the
# Europe/Oslo timetable (src/lite/clock.ts; summer and winter time), dispatches it, and then
# dispatches itself again (also after a failure or cancellation; disable the workflow to stop it). A run never sleeps longer than 5.5 h (GitHub's job limit is 6 h); it
# then only re-arms. GITHUB_TOKEN may dispatch workflow_dispatch events, so the chain needs no
# personal token. The cron entries below are a backstop that restarts the chain if it ever breaks.
# Only one clock runs at a time (concurrency group); a pending duplicate is replaced by the next
# re-arm. Everything it starts has its own lock and checks: Lite Outreach keeps its single
# concurrency group, the 11:00-12:00 slot, 95 per rolling 24 h, Resend quotas, delivery health,
# reservations and idempotency, so a duplicate dispatch only continues the slot or no-ops.
#   06:40 Lite Lead Intake (top up to 1500 Lite Ready)   08:10 Lite Readiness (read-only)
#   10:40 Lite Outreach (waits for 11:00)   11:20 reserve Lite Outreach   12:10 Daily Report + Readiness
on:
  workflow_dispatch:
  schedule:
    - cron: "3 */2 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: gullkornet-lite-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Plan the next event (Europe/Oslo)
        id: plan
        run: |
          read -r secs action at missed missed_at <<< "$(npm run --silent lite:clock)"
          case "$secs" in ''|*[!0-9]*) echo "Invalid plan"; exit 1 ;; esac
          echo "Planned next event: $action at $at (sleeping ${secs}s). Missed event in grace: $missed $missed_at"
          {
            echo "secs=$secs"; echo "action=$action"; echo "at=$at"; echo "missed=$missed"; echo "missed_at=$missed_at"
          } >> "$GITHUB_OUTPUT"
      # A late or interrupted clock (queued re-arm, cancelled hop) starts an event it missed, unless
      # its workflow already has a run created since the event's time.
      - name: Catch up a missed event
        if: steps.plan.outputs.missed != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/lite-clock-fire.sh "${{ steps.plan.outputs.missed }}" "${{ steps.plan.outputs.missed_at }}"
      - name: Sleep until the event
        run: sleep "${{ steps.plan.outputs.secs }}"
      - name: Fire the event
        if: steps.plan.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/lite-clock-fire.sh "${{ steps.plan.outputs.action }}" "${{ steps.plan.outputs.at }}"
      # Runs after success, failure and cancellation alike, so an interrupted hop restarts the chain.
      # To stop the clock, disable this workflow (Actions > Gullkornet Lite Clock > Disable).
      - name: Re-arm the clock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lite-clock.yml --ref main
