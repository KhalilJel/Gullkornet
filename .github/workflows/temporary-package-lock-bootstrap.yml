name: Temporary package-lock bootstrap

on:
  push:
    branches:
      - fix/privacy-safe-cli-preview-2026-10-10
    paths:
      - ".github/workflows/temporary-package-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-and-commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-safe-cli-preview-2026-10-10
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add npm package lockfile"
            git push origin HEAD:fix/privacy-safe-cli-preview-2026-10-10
          fi
