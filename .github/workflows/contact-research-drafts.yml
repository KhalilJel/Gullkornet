name: Gullkornet Contact Research and Drafts

on:
  workflow_run:
    workflows: ["Gullkornet Website Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: "Successful Website Audit workflow run ID whose artifact should be processed"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download website audit and candidate inputs
        uses: actions/download-artifact@v4
        with:
          name: gullkornet-website-audit
          path: data/input
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Research public contact emails and prepare drafts
        run: |
          test -f data/input/website-audit.json
          test -f data/input/source/google-candidates.json
          npm run --silent research:contacts -- data/input/source/google-candidates.json data/input/website-audit.json > data/contact-research-drafts.json
          npm run --silent review-queue -- data/contact-research-drafts.json data/lead-review-queue.md
          echo "Contact research and review queue complete. No emails were sent."

      - name: Sync leads to persistent Airtable registry when configured
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          GULLKORNET_AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
        run: |
          if [ -z "$AIRTABLE_API_TOKEN" ] || [ -z "$GULLKORNET_AIRTABLE_BASE_ID" ]; then
            echo "Airtable sync skipped: configure AIRTABLE_API_TOKEN secret and GULLKORNET_AIRTABLE_BASE_ID variable."
            exit 0
          fi
          npm run --silent sync:airtable -- data/contact-research-drafts.json

      - name: Create metadata-only research summary
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const records = JSON.parse(await readFile("data/contact-research-drafts.json", "utf8"));
            const summary = {
              generatedAt: new Date().toISOString(),
              totalRecords: records.length,
              recordsWithPublicEmail: records.filter((record) => Array.isArray(record.emails) && record.emails.length > 0).length,
              recordsWithDraft: records.filter((record) => typeof record.subject === "string" && typeof record.draftBody === "string").length,
              recordsNeedingReview: records.filter((record) => record.researchStatus === "REVIEW_REQUIRED").length,
              emailSent: 0
            };
            await writeFile("data/contact-research-summary.json", JSON.stringify(summary, null, 2) + "\\n", { encoding: "utf8", mode: 0o600 });
          '

      - name: Upload metadata-only research summary
        uses: actions/upload-artifact@v4
        with:
          name: gullkornet-contact-research-summary
          path: data/contact-research-summary.json
          retention-days: 7
