name: Gullkornet Google Places Discovery

on:
  # Run every day, including weekends. Downstream audit and contact-research workflows
  # continue automatically from the completed discovery run.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      search_term:
        description: "Business type to search for"
        required: true
        default: "frisør"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check current Airtable draft queue
        id: queue
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.GULLKORNET_AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE: ${{ vars.GULLKORNET_AIRTABLE_TABLE || 'Leads' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const token = process.env.AIRTABLE_API_TOKEN?.trim();
          const baseId = process.env.AIRTABLE_BASE_ID?.trim();
          const table = process.env.AIRTABLE_TABLE?.trim() || "Leads";
          let count = 999;
          if (!token || !baseId) {
            console.log("Airtable queue check unavailable; using normal discovery schedule.");
          } else {
            try {
              let offset;
              count = 0;
              do {
                const url = new URL(`https://api.airtable.com/v0/${baseId}/${encodeURIComponent(table)}`);
                url.searchParams.set("pageSize", "100");
                url.searchParams.set("filterByFormula", '{Lead Status}="Draft Ready"');
                url.searchParams.append("fields[]", "Lead Status");
                if (offset) url.searchParams.set("offset", offset);
                const response = await fetch(url, {
                  headers: { Authorization: `Bearer ${token}` },
                  signal: AbortSignal.timeout(15000)
                });
                if (!response.ok) throw new Error(`Airtable HTTP ${response.status}`);
                const page = await response.json();
                count += page.records?.length ?? 0;
                offset = page.offset;
              } while (offset);
              console.log(`Current Draft Ready queue: ${count}`);
            } catch (error) {
              console.log(`Airtable queue check failed; using normal discovery schedule: ${error instanceof Error ? error.message : "unknown error"}`);
              count = 999;
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `count=${count}\n`);
          NODE

      - name: Select daily business segments
        id: segment
        env:
          REQUESTED_TERM: ${{ inputs.search_term }}
          QUEUE_COUNT: ${{ steps.queue.outputs.count }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "terms=${REQUESTED_TERM}" >> "$GITHUB_OUTPUT"
          else
            # Normally search two categories. When the Airtable draft queue is low,
            # add the next day's categories to replenish stock before it runs out.
            day="$(date -u +%u)"
            case "$day" in
              1) primary="frisør|restaurant"; next="regnskapsfører|tannlege"; later="bilverksted|elektriker" ;;
              2) primary="regnskapsfører|tannlege"; next="bilverksted|elektriker"; later="rørlegger|renhold" ;;
              3) primary="bilverksted|elektriker"; next="rørlegger|renhold"; later="fysioterapeut|treningssenter" ;;
              4) primary="rørlegger|renhold"; next="fysioterapeut|treningssenter"; later="frisør|hudpleie" ;;
              5) primary="fysioterapeut|treningssenter"; next="frisør|hudpleie"; later="advokat|eiendomsmegler" ;;
              6) primary="frisør|hudpleie"; next="advokat|eiendomsmegler"; later="frisør|restaurant" ;;
              7) primary="advokat|eiendomsmegler"; next="frisør|restaurant"; later="regnskapsfører|tannlege" ;;
            esac
            terms="$primary"
            if [ "${QUEUE_COUNT:-999}" -lt 60 ]; then
              terms="$terms|$next"
              echo "Draft queue below 60; expanding discovery to four categories."
            fi
            if [ "${QUEUE_COUNT:-999}" -lt 30 ]; then
              terms="$terms|$later"
              echo "Draft queue below 30; expanding discovery to six categories."
            fi
            echo "terms=$terms" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore discovery history
        uses: actions/cache/restore@v4
        with:
          path: data/discovery-history.json
          key: gullkornet-discovery-history-${{ github.run_id }}
          restore-keys: |
            gullkornet-discovery-history-

      - name: Discover and deduplicate candidates across segments
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SEARCH_TERMS: ${{ steps.segment.outputs.terms }}
          DAILY_LEAD_LIMIT: ${{ vars.DAILY_LEAD_LIMIT || '100' }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Missing repository secret GOOGLE_MAPS_API_KEY."
            exit 1
          fi
          mkdir -p data
          if [ ! -s data/discovery-history.json ]; then
            printf '{"domains":[],"companyNames":[]}' > data/discovery-history.json
          fi
          files=()
          index=0
          IFS='|' read -ra TERMS <<< "$SEARCH_TERMS"
          for term in "${TERMS[@]}"; do
            slug=$(printf '%s' "$term" | tr -cd '[:alnum:]')
            file="data/candidates-${index}-${slug}.json"
            npm run --silent discover:google -- "$term" > "$file"
            files+=("$file")
            index=$((index + 1))
          done
          node --input-type=module -e '
            import { readFileSync, writeFileSync, existsSync } from "node:fs";
            const map = new Map();
            for (const file of process.argv.slice(1)) {
              const candidates = JSON.parse(readFileSync(file, "utf8"));
              for (const candidate of candidates) {
                const website = candidate.websiteUrl ? new URL(candidate.websiteUrl).hostname.toLowerCase().replace(/^www\./, "") : "";
                const key = website || candidate.companyName.trim().toLocaleLowerCase("nb-NO");
                const current = map.get(key);
                if (!current || (!current.websiteUrl && candidate.websiteUrl)) map.set(key, candidate);
              }
            }
            const history = existsSync("data/discovery-history.json")
              ? JSON.parse(readFileSync("data/discovery-history.json", "utf8"))
              : { domains: [], companyNames: [] };
            const knownDomains = new Set(Array.isArray(history.domains) ? history.domains : []);
            const knownNames = new Set(Array.isArray(history.companyNames) ? history.companyNames : []);
            const dailyLimit = Math.max(1, Number.parseInt(process.env.DAILY_LEAD_LIMIT || "100", 10) || 100);
            const fresh = [...map.values()].filter((candidate) => {
              const website = candidate.websiteUrl ? new URL(candidate.websiteUrl).hostname.toLowerCase().replace(/^www\./, "") : "";
              const name = candidate.companyName.trim().toLocaleLowerCase("nb-NO");
              return !(website && knownDomains.has(website)) && !knownNames.has(name);
            }).slice(0, dailyLimit);
            writeFileSync("data/google-candidates.json", JSON.stringify(fresh, null, 2));
            const domains = new Set(knownDomains);
            const names = new Set(knownNames);
            for (const candidate of fresh) {
              if (candidate.websiteUrl) domains.add(new URL(candidate.websiteUrl).hostname.toLowerCase().replace(/^www\./, ""));
              names.add(candidate.companyName.trim().toLocaleLowerCase("nb-NO"));
            }
            writeFileSync("data/discovery-history.json", JSON.stringify({
              domains: [...domains],
              companyNames: [...names]
            }, null, 2));
            console.error("Discovery complete: " + map.size + " unique candidates across " + (process.argv.length - 1) + " segment files; " + fresh.length + " new candidates after cross-run dedupe and daily cap. No email was sent.");
          ' "${files[@]}"
      - name: Save discovery history for future runs
        uses: actions/cache/save@v4
        with:
          path: data/discovery-history.json
          key: gullkornet-discovery-history-${{ github.run_id }}

      - name: Upload candidate results
        uses: actions/upload-artifact@v4
        with:
          name: gullkornet-google-candidates
          path: |
            data/google-candidates.json
            data/discovery-history.json
          retention-days: 30
